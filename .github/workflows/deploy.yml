name: CI & Deploy Revision Portal

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'apps/portal/package-lock.json'

      - name: Install Dependencies
        working-directory: ./apps/portal
        run: npm ci

      - name: Generate Manifest & Sync Notes
        working-directory: ./apps/portal
        run: npm run manifest

      - name: Execute Integrity Test Suite & LaTeX Validator
        working-directory: ./apps/portal
        run: npm test

      - name: TypeScript Type Check
        working-directory: ./apps/portal
        run: npx tsc --noEmit

      - name: Build Production Vite Bundle
        working-directory: ./apps/portal
        run: npm run build

      - name: Upload GitHub Pages Artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./apps/portal/dist

  deploy-pages:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
